name: Integration (lab VM)

# Actions are pinned by SHA; Dependabot updates the SHA and its version comment together.

# Installs the built Vanta package on a Hyper-V lab VM and verifies the result with the
# health check and a before/after state diff. This needs a self-hosted Windows runner
# with Hyper-V, a prepared VM checkpoint and a guest credential; hosted runners cannot
# run it. Register a runner with the labels below and set the repository variables and
# secret to enable the job. The job is skipped while VANTA_LAB_VM is unset.
#
# The front door runs in the lab account's signed-in session, through a one-time
# scheduled task, so take a standard checkpoint while that account is signed in, with
# Windows Update and Microsoft Store up to date. tools/lab/Invoke-VantaLabRun.ps1 lists
# every prerequisite.
#
# Runner labels: self-hosted, windows, hyperv
# Variables: VANTA_LAB_VM (VM name), VANTA_LAB_CHECKPOINT (checkpoint name),
#   VANTA_LAB_USER (the local administrator account the checkpoint is signed in as,
#   other than the built-in Administrator, which Vanta refuses)
# Secrets: VANTA_LAB_PASSWORD (that account's password)

on:
  workflow_dispatch:
    inputs:
      options:
        description: "Comma-separated option ids from atlas.json for the install"
        required: false
        default: "defender-enable,mitigations-default,auto-updates-default,keyboard-shortcuts"
        type: string

permissions:
  contents: read

concurrency:
  group: integration-lab
  cancel-in-progress: false

jobs:
  lab:
    name: Install and verify on the lab VM
    # The job is skipped, not failed, when no lab runner has been configured.
    if: vars.VANTA_LAB_VM != ''
    runs-on: [self-hosted, windows, hyperv]
    timeout-minutes: 180

    steps:
      - name: Check the lab settings
        # Before the build, so a missing setting fails in seconds.
        shell: pwsh
        env:
          VANTA_LAB_USER: ${{ vars.VANTA_LAB_USER }}
          VANTA_LAB_CHECKPOINT: ${{ vars.VANTA_LAB_CHECKPOINT }}
          VANTA_LAB_PASSWORD_SET: ${{ secrets.VANTA_LAB_PASSWORD != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          if (-not $env:VANTA_LAB_USER) { $missing += 'the VANTA_LAB_USER variable' }
          if (-not $env:VANTA_LAB_CHECKPOINT) { $missing += 'the VANTA_LAB_CHECKPOINT variable' }
          if ($env:VANTA_LAB_PASSWORD_SET -ne 'true') { $missing += 'the VANTA_LAB_PASSWORD secret' }
          if ($missing.Count -gt 0) {
              throw "Set $($missing -join ', ') to run the lab. VANTA_LAB_USER is the local administrator account the checkpoint is signed in as, other than the built-in Administrator, which Vanta refuses."
          }

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Vanta package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP ('vanta-lab-' + [guid]::NewGuid().ToString('N'))
          New-Item -Path $output -ItemType Directory -ErrorAction Stop | Out-Null
          & tools/build/Build-Package.ps1 -FileName 'Vanta Lab' `
              -OutputPath $output -NoExplorer
          $package = Get-Item -LiteralPath (Join-Path $output 'Vanta Lab.atlaspkg') -ErrorAction Stop
          "VANTA_LAB_PACKAGE=$($package.FullName)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install on the lab VM and verify
        shell: pwsh
        env:
          VANTA_LAB_USER: ${{ vars.VANTA_LAB_USER }}
          VANTA_LAB_PASSWORD: ${{ secrets.VANTA_LAB_PASSWORD }}
          VANTA_LAB_VM: ${{ vars.VANTA_LAB_VM }}
          VANTA_LAB_CHECKPOINT: ${{ vars.VANTA_LAB_CHECKPOINT }}
          LAB_OPTIONS: ${{ github.event.inputs.options }}
        run: |
          $ErrorActionPreference = 'Stop'
          $secure = ConvertTo-SecureString -String $env:VANTA_LAB_PASSWORD -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($env:VANTA_LAB_USER, $secure)
          $package = Get-Item -LiteralPath $env:VANTA_LAB_PACKAGE -ErrorAction Stop
          $options = @($env:LAB_OPTIONS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $lab = @{
              VMName         = $env:VANTA_LAB_VM
              CheckpointName = $env:VANTA_LAB_CHECKPOINT
              Credential     = $credential
              PackagePath    = $package.FullName
              OutputPath     = 'lab-output/run'
          }
          # Without options, the lab run installs its recommended set.
          if ($options.Count -gt 0) { $lab.Option = $options }
          & tools/lab/Invoke-VantaLabRun.ps1 @lab
          if ($LASTEXITCODE -ne 0) { throw "Lab run failed with exit code $LASTEXITCODE." }

      - name: Upload lab output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-output
          path: lab-output/run
          if-no-files-found: ignore
