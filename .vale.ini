# Vale checks the prose in Markdown files against docs/style.md, with the rules in
# .github/vale/Vanta. Vale skips code spans and code blocks, so identifiers are safe.
StylesPath = .github/vale
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Vanta
# Status words are checked only under docs/, where pages must stay true from one
# release to the next.
Vanta.Status = NO

[docs/**/*.md]
Vanta.Status = YES

# The style guide quotes the words these rules flag.
[docs/style.md]
BasedOnStyles =

# Upstream documentation of vendored crates and licences stays as written.
[{app/vendor/**/*.md,app/licenses/supplemental/**/*.md}]
BasedOnStyles =

# The notes Vanta keeps beside vendored code.
[{app/vendor/*/VANTA-PATCH.md,app/vendor/gpui-pre-windows/prebuilt/README.md}]
BasedOnStyles = Vanta
Vanta.Status = NO
